[project]
name = "security-sentinel"
version = "0.1.0"
description = "Security-focused MCP server"
authors = [
    {name = "UnnatiBhalekar",email = "unnatibhalekar12345@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "mcp (>=1.27.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "fastapi (>=0.161.0,<0.162.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mangum (>=0.22.0,<0.23.0)"
]
