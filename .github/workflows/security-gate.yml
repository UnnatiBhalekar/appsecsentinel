name: Security Gate

# Run on every PR and on direct pushes to main.
on:
  pull_request:
  push:
    branches: [main, master]

# Top-level permissions are as restrictive as possible.
# Individual jobs override only what they need.
permissions:
  contents: read

jobs:
  # ── Job 1: tests + self-scan ──────────────────────────────────────────────
  test-and-scan:
    name: Tests & SARIF self-scan
    runs-on: ubuntu-latest

    # security-events: write is required by upload-sarif; granted here rather
    # than at the workflow level so the checkout/test steps stay read-only.
    permissions:
      contents: read
      security-events: write

    steps:
      # actions/checkout — pinned to a full commit SHA so a tag rollback or
      # a compromised release cannot silently swap in different code.
      # Dependabot (.github/dependabot.yml) will open a PR when a newer SHA
      # is available for this version tag.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-python — same pinning rationale; setup actions run before
      # any sandboxing and have been the target of supply-chain attacks in other
      # ecosystems.
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry --quiet

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --quiet

      # Full pytest suite includes:
      #   test_quality.py    — precision ≥ 0.95, recall ≥ 0.90
      #   test_api.py        — endpoint contracts, 413, injection rejection
      #   test_cli.py        — exit codes, SARIF structure, --exclude
      #   test_guardrails.py — audit log stream/file modes
      - name: Run tests
        run: poetry run pytest tests/ -v

      # Self-scan: the project scans its own source code.
      # python_ast_scanner.py and core/scanner.py are excluded because they
      # contain the pattern strings the scanner looks for, which would cause
      # false-positive hits on the tool's own source.
      # continue-on-error lets the upload step always run even if CRITICAL
      # findings are detected — the job still fails, but the SARIF is uploaded.
      - name: Self-scan (SARIF)
        run: |
          poetry run python sentinel_cli.py scan \
            core api server.py sentinel_cli.py \
            --exclude python_ast_scanner.py \
            --exclude core/scanner.py \
            --format sarif \
            --fail-on CRITICAL \
            > results.sarif
        continue-on-error: true

      # github/codeql-action/upload-sarif — pinned to a full commit SHA.
      # This action parses SARIF produced by potentially-tainted scanner output;
      # pinning ensures the parser is a reviewed, known version.
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: results.sarif
          category: appsec-sentinel
